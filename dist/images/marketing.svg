<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#fdf4ff"/>
  <!-- Megaphone / Digital Marketing -->
  <g transform="translate(60, 60)">
    <!-- Sound Waves -->
    <path d="M190 40a60 60 0 0 1 0 70" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M210 25a85 85 0 0 1 0 100" stroke="#18337a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M230 10a110 110 0 0 1 0 130" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Megaphone Cone -->
    <polygon points="160,20 80,55 80,95 160,130" fill="#18337a"/>
    <ellipse cx="160" cy="75" rx="12" ry="55" fill="#264bb5"/>
    <!-- Handle -->
    <path d="M90 95v40c0 8 10 12 18 8l8-6v-42" fill="#0f2252"/>
    <!-- Speaker Body -->
    <rect x="50" y="60" width="30" height="30" rx="4" fill="#0284c7"/>
    <rect x="36" y="67" width="14" height="16" rx="2" fill="#38bdf8"/>
  </g>
  <!-- Social Media & Growth Chart -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="110" height="75" rx="8" fill="#18337a"/>
    <!-- Trend line -->
    <path d="M15 55 L40 40 L65 45 L95 18" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="95" cy="18" r="4" fill="#4ade80"/>
  </g>
</svg>