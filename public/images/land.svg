<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#eff6ff"/>
  <!-- Map / Land Plot Outline -->
  <g transform="translate(40, 40)">
    <!-- Land parcel -->
    <polygon points="40,20 220,10 280,130 90,160 20,90" fill="#bfdbfe" stroke="#18337a" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="60,40 190,30 240,120 100,140 45,90" fill="#93c5fd" opacity="0.5"/>
    <!-- Dimensions marker -->
    <line x1="40" y1="12" x2="220" y2="2" stroke="#0284c7" stroke-width="2"/>
    <circle cx="40" cy="12" r="4" fill="#0284c7"/>
    <circle cx="220" cy="2" r="4" fill="#0284c7"/>
    <!-- Building Development / Commercial complex -->
    <rect x="130" y="55" width="45" height="85" rx="3" fill="#18337a"/>
    <rect x="140" y="65" width="8" height="10" fill="#e0f2fe"/>
    <rect x="155" y="65" width="8" height="10" fill="#e0f2fe"/>
    <rect x="140" y="85" width="8" height="10" fill="#e0f2fe"/>
    <rect x="155" y="85" width="8" height="10" fill="#e0f2fe"/>
    <rect x="140" y="105" width="8" height="10" fill="#e0f2fe"/>
    <rect x="155" y="105" width="8" height="10" fill="#e0f2fe"/>

    <rect x="180" y="80" width="55" height="60" rx="3" fill="#264bb5"/>
    <rect x="190" y="90" width="10" height="10" fill="#ffffff"/>
    <rect x="210" y="90" width="10" height="10" fill="#ffffff"/>
    <rect x="190" y="110" width="10" height="10" fill="#ffffff"/>
    <rect x="210" y="110" width="10" height="10" fill="#ffffff"/>
  </g>
  <!-- Handshake / Joint Venture Badge -->
  <g transform="translate(290, 40)">
    <circle cx="40" cy="40" r="36" fill="#18337a"/>
    <path d="M22 42l12 10 12-8 12 8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="30" r="5" fill="#38bdf8"/>
    <circle cx="46" cy="30" r="5" fill="#38bdf8"/>
  </g>
</svg>